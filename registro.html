    <main class="main-content">

    <h1>REGISTRO</h1>
    
    <form id="formularioRegistro">
        <div class="grupo-entrada">
            <input type="text" id="userID" placeholder="targeta de identidad" required>
            <i class="fa-solid fa-user"></i>
        </div>

        <div class="grupo-entrada">
            <input type="password" id="pass1" placeholder="Contraseña" required>
            <i class="fa-solid fa-lock"></i>
        </div>

         <div class="grupo-entrada">
            <input type="password" id="pass2" placeholder="Contraseña" required>
            <i class="fa-solid fa-lock"></i>
        </div>
        
        <button type="submit" class="boton-ingresar">Ingresar</button>
    </form>
</div>
        <div class="footer">

            <br>

    <script>
    document.getElementById('formularioRegistro').addEventListener('submit', function(event) {
        // Detenemos el envío normal
        event.preventDefault();

        // Obtenemos los valores
        const p1 = document.getElementById('pass1').value;
        const p2 = document.getElementById('pass2').value;

        // Validación de contraseñas
        if (p1 !== p2) {
            alert("Las contraseñas no coinciden.");
        } else {
            // REDIRECCIÓN DIRECTA
            // Nota: Si tu archivo tiene espacios, se escribe así:
            window.location.href = "pagina%20estudiante.html";
        }
    });
</script>
