<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila Pro</title>
    <link rel="stylesheet" href="inicioseccion.css">
    <link rel="icon" type="image/x-icon" href="Fila pro.jpg">
</head>
<body>
      
    <main class="foto">
        <div class="banner" style="margin-top: 15px";>
            <img src="Fila pro.jpg">
        </div>
        
        <div class="welcome-box">
            <p>Por favor inicia sesión con tu cuenta correspondiente 😊🍕</p>
        </div>
        <br>

        <div class="contenedor-login">
            <div class="selector-perfil">
                <div id="btn-estudiante" class="opcion-perfil activa" onclick="cambiarPerfil('estudiante')">Estudiante</div>
                <div id="btn-profesor" class="opcion-perfil" onclick="cambiarPerfil('profesor')">Profesor</div>
            </div>

            <h1 id="titulo-dinamico">Inicie Sesión</h1>
            
            <form id="form-login">
                <div class="grupo-entrada">
                    <input type="text" id="user" placeholder="Nombre de usuario" required>
                    <i class="fa-solid fa-user"></i>
                </div>
                
                <div class="grupo-entrada">
                    <input type="password" id="pass" placeholder="Contraseña" required>
                    <i class="fa-solid fa-lock"></i>
                </div>
                
                <button type="submit" class="boton-ingresar">Ingresar</button>
            </form>
        </div>

        <div class="footer">
            <div class="info-footer">
                <h3>🔎 Dirección</h3>
                <p>Carrera 81 #43 sur 38</p>
                <p>San Antonio De Prado, Colombia</p>
            </div>
            <br>
            <div class="info-footer">
                <h3>📞 Contacto</h3>
                <p>3127127266</p>
                <p>mjb@iemanueljbetancur.edu.co</p>
            </div>
        </div>

        <footer class="mini-footer">
            Copyright © 2025-2026 - Todos los derechos reservados (Fila Pro).
        </footer>
    </main>

    <script>
        let perfilActual = 'estudiante';

        function cambiarPerfil(perfil) {
            perfilActual = perfil;
            const btnEst = document.getElementById('btn-estudiante');
            const btnProf = document.getElementById('btn-profesor');
            const titulo = document.getElementById('titulo-dinamico');
            const inputPass = document.getElementById('pass');

            if (perfil === 'estudiante') {
                btnEst.classList.add('activa');
                btnProf.classList.remove('activa');
                titulo.innerText = "Estudiante";
                inputPass.placeholder = "Contraseña (Número de TI)";
            } else {
                btnProf.classList.add('activa');
                btnEst.classList.remove('activa');
                titulo.innerText = "Profesor";
                inputPass.placeholder = "Contraseña (Cédula)";
            }
        }

        // ÚNICA FUNCIÓN DE VALIDACIÓN Y REDIRECCIÓN
        document.getElementById('form-login').addEventListener('submit', function(e) {
            e.preventDefault(); // Detiene el envío automático
            
            const usuarioIngresado = document.getElementById('user').value;
            const claveIngresada = document.getElementById('pass').value;

            if (perfilActual === 'estudiante') {
                //Validación Estudiante//
                if (usuarioIngresado === 'davidt' && claveIngresada === '1234') {
                    window.location.href = "pagina estudiante.html";
                } else {
                    alert("Usuario o contraseña de Estudiante incorrectos. ☹️");
                }
            } 
            else {
                //validación del profesor//
                if (usuarioIngresado === 'profesor' && claveIngresada === '1234') {
                    window.location.href = "pagina maestro.html";
                } else {
                    alert("Usuario o contraseña de Profesor incorrectos. ☹️");
                }
            }
        });

        
  document.querySelectorAll('a[href]').forEach(function(link) {
    link.addEventListener('click', function(e) {
      var href = this.getAttribute('href');
      if (!href || href.startsWith('#') || href.startsWith('http')) return;
      e.preventDefault();
      document.body.style.transition = 'opacity 0.25s ease, transform 0.25s ease';
      document.body.style.opacity    = '0';
      document.body.style.transform  = 'translateY(-14px)';
      setTimeout(function() { window.location.href = href; }, 260);
    });
  });

    </script>
</body>
</html>
