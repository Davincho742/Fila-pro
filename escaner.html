        .icono-exito {
            font-size: 4rem;

        }
        h1 { font-size: 1.6rem; margin-bottom: 10px; }
        p { color: #aaaaaa; font-size: 1rem; }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }

        // En esta función capturo los datos directamente desde la URL del QR
        function procesarEscaneoQR() {
            const parametrosURL = new URLSearchParams(window.location.search);
            const idEstudiante = parametrosURL.get('id'); // Obtengo el 'EST-28' por ejemplo

            if (!idEstudiante) {
                document.getElementById('mensaje-estado').innerText = "ERROR: Código QR no válido o corrupto.";
                return;
            }

            // Calculo la fecha de hoy de forma idéntica a como la lee mi calendario
            const fechaHoy = new Date();
            const año = fechaHoy.getFullYear();
            const mes = String(fechaHoy.getMonth() + 1).padStart(2, '0');
            const dia = String(fechaHoy.getDate()).padStart(2, '0');
            const claveFechaHoy = `${año}-${mes}-${dia}`;

            // Abro el historial del estudiante en la memoria
            let historial = JSON.parse(localStorage.getItem(`asistencia_${idEstudiante}`)) || [];

            // Valido si ya se había escaneado hoy para avisar
            if (historial.includes(claveFechaHoy)) {
                document.getElementById('mensaje-estado').innerText = "Este almuerzo ya fue reclamado el día de hoy.";
            } else {
                // Registro la asistencia de hoy en su base de datos local
                historial.push(claveFechaHoy);
                localStorage.setItem(`asistencia_${idEstudiante}`, JSON.stringify(historial));
                document.getElementById('mensaje-estado').innerText = `Almuerzo registrado con éxito para el ID: ${idEstudiante}.`;
            }
        }
