<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fila Pro</title>
    <link rel="icon" type="image/x-icon" href="Fila pro.jpg">
    <link rel="stylesheet" href="escaner.css">
</head>
<body>

    <div class="tarjeta-alerta">
        <div class="icono-exito">✓</div>
        <h1>Código ya escaneado</h1>
        <p id="mensaje-estado">Procesando almuerzo...</p>
    </div>

    <script>
        // Función principal para procesar el escaneo desde la URL
        function procesarEscaneoQR() {
            const parametrosURL = new URLSearchParams(window.location.search);
            const idEstudiante = parametrosURL.get('id');

            if (!idEstudiante) {
                document.getElementById('mensaje-estado').innerText = "ERROR: Código QR no válido o corrupto.";
                return;
            }

            // Cálculo de fecha actual
            const fechaHoy = new Date();
            const año = fechaHoy.getFullYear();
            const mes = String(fechaHoy.getMonth() + 1).padStart(2, '0');
            const dia = String(fechaHoy.getDate()).padStart(2, '0');
            const claveFechaHoy = `${año}-${mes}-${dia}`;

            // Lectura del historial en LocalStorage
            let historial = JSON.parse(localStorage.getItem(`asistencia_${idEstudiante}`)) || [];

            // Validación de registro duplicado
            if (historial.includes(claveFechaHoy)) {
                document.getElementById('mensaje-estado').innerText = "Este almuerzo ya fue reclamado el día de hoy.";
            } else {
                historial.push(claveFechaHoy);
                localStorage.setItem(`asistencia_${idEstudiante}`, JSON.stringify(historial));
                document.getElementById('mensaje-estado').innerText = `Almuerzo registrado con éxito para el ID: ${idEstudiante}.`;
            }
        }

        // Ejecución al cargar
        procesarEscaneoQR();

        // Lógica complementaria para el calendario de la sesión
        const estudianteSesionID = "EST-28"; 
        const historialAsistencias = JSON.parse(localStorage.getItem(`asistencia_${estudianteSesionID}`)) || [];

        // Función de apoyo para integrar con el renderizado de celdas
        function verificarAsistenciaDia(claveFechaCompleta, celdaDia) {
            if (historialAsistencias.includes(claveFechaCompleta)) {
                celdaDia.classList.add("asistio");
            }
        }
    </script>
</body>
</html>
